[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoid-pinn"
version = "0.1.0"
description = "Reproducibility code for GeoID-PINN epidemic forecasting experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "ipykernel>=6.29",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "nbconvert>=7.16",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
